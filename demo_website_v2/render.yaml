services:
  - type: web
    name: hackathon-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MODAL_WEB_URL
        value: https://kpower7--chat-with-pdf-vision-web.modal.run
      - key: DEFAULT_OSS_MODEL
        value: gpt-oss-120b
      - key: OSS_DEV_STUB
        value: "0"
